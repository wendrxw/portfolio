<!DOCTYPE html>
<html lang="pt-BR">

    <title>{% block title %}Wendrew Oliveira | Senior Python Developer{% endblock %}</title>
    <meta name="description" content="Portfólio de Wendrew Oliveira - desenvolvedor Python, Linux e sistemas inteligentes.">
